# CI/CD : à chaque push et à chaque pull request, GitHub
#   1. lance tous les tests (pytest) ;
#   2. construit l'image Docker du service d'audit et vérifie qu'elle démarre (API + interface) ;
#   3. (push seulement) publie l'image sur GitHub Container Registry : ghcr.io/<propriétaire>/<dépôt> ;
#   4. teste la couche Big Data avec un vrai Kafka (conteneur) et un vrai Spark (Java 17).
# Résultat visible dans l'onglet « Actions » du dépôt et sur le badge du README.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:          # bouton « Run workflow » pour relancer à la main

permissions:
  contents: read

concurrency:                  # un nouveau push annule l'exécution précédente de la même branche
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Installer les dépendances des tests
        # Pas de PyTorch : les tests n'exécutent pas le modèle (il est remplacé par un faux dans test_api.py).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt rank-bm25==0.2.2 openpyxl==3.1.5 pytest==8.3.3 httpx==0.27.2

      - name: Lancer les tests
        run: python -m pytest -v

  bigdata:
    name: Big Data (Kafka + Spark)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    services:
      kafka:                  # un vrai broker Kafka, à côté de la machine de test
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-bigdata.txt

      - name: Installer Java 17 (pour Spark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-bigdata.txt pytest==8.3.3

      - name: Attendre que Kafka soit prêt
        run: |
          python - <<'PY'
          import time
          from confluent_kafka.admin import AdminClient
          admin = AdminClient({"bootstrap.servers": "localhost:9092"})
          for i in range(60):
              try:
                  admin.list_topics(timeout=2)
                  print("Kafka prêt"); break
              except Exception as exc:
                  print("attente de Kafka...", exc); time.sleep(2)
          else:
              raise SystemExit("Kafka ne répond pas")
          PY

      - name: Tests d'intégration Kafka + Spark
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: python -m pytest tests/integration -v -s

  docker:
    name: Image Docker (construction + démarrage + publication)
    runs-on: ubuntu-latest
    needs: tests              # on ne construit l'image que si les tests passent
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write         # droit de publier l'image dans les « Packages » du dépôt
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: audit-conformite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer le conteneur et vérifier qu'il répond
        # Le modèle (versionné par DVC) n'est pas sur GitHub : on vérifie le service et l'interface, pas l'inférence.
        run: |
          docker run -d --name audit -p 8000:8000 audit-conformite:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health | grep -q '"ok"'
          curl -fsS http://localhost:8000/app/ | grep -q "Agent d'audit"
          echo "Service et interface OK"

      - name: Journal du conteneur (en cas d'échec)
        if: failure()
        run: docker logs audit || true

      # ---- Livraison continue : l'image testée est publiée (pas pour les pull requests) ----
      - name: Étiquettes de l'image
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Connexion à GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # couches déjà construites plus haut : quelques secondes

      - name: Résumé
        if: github.event_name != 'pull_request'
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
