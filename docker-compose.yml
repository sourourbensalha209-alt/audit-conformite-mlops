# Lancement de tout le projet :   docker compose up --build
#   Interface + API : http://localhost:8000
#   MLflow          : http://localhost:5000

services:

  api:
    build: .
    image: audit-conformite:latest
    container_name: audit-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models:ro                 # modèle Legal-BERT v4 (récupéré avec dvc pull), lecture seule
      - ./data/feedback:/app/data/feedback      # corrections des juristes : gardées sur le disque, hors du conteneur
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: audit-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
